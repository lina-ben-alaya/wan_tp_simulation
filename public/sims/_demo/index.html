<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabarit de test – pont ActivePresenter</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0d1324; color: #e6eaf2; display: grid; place-items: center; min-height: 100vh; }
  .slide { max-width: 560px; padding: 32px; text-align: center; }
  .tag { display: inline-block; font: 600 12px/1 monospace; letter-spacing: .1em; padding: 6px 10px; border-radius: 6px; background: #2e2410; color: #fbbf24; margin-bottom: 16px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 0; background: #7b93ff; color: #0a0f1d; cursor: pointer; margin: 4px; }
  .opt { display: block; width: 100%; background: #172036; color: #e6eaf2; border: 1px solid #33415f; text-align: left; }
</style>
</head>
<body>
<!--
  Gabarit de TEST du pont plateforme ↔ ActivePresenter. Ce n'est PAS un export ActivePresenter.
  Il reproduit uniquement ce qu'un export doit faire sur sa dernière diapositive :
  parent.postMessage({ source: 'itlab-ap', tp: '<slug>', score, max }, '*')
-->
<div class="slide" id="app"></div>
<script>
  var params = new URLSearchParams(location.search);
  var tp = params.get('tp') || 'demo';
  var score = 0;
  var app = document.getElementById('app');
  function intro() {
    app.innerHTML = '<span class="tag">GABARIT DE TEST – PAS UN EXPORT ACTIVEPRESENTER</span>' +
      '<h1>Diapositive 1</h1><p>Ce gabarit vérifie que la plateforme reçoit le score d’une simulation intégrée.</p>' +
      '<button onclick="question()">Suivant</button>';
  }
  function question() {
    app.innerHTML = '<span class="tag">QUESTION</span><h2>Quelle commande affiche la LFIB ?</h2>' +
      '<button class="opt" onclick="answer(false)">show mpls ldp bindings</button>' +
      '<button class="opt" onclick="answer(true)">show mpls forwarding-table</button>';
  }
  function answer(ok) {
    if (ok) score = 1;
    app.innerHTML = '<h2>' + (ok ? 'Bonne réponse' : 'Réponse incorrecte') + '</h2><button onclick="end()">Résultat</button>';
  }
  function end() {
    app.innerHTML = '<span class="tag">FIN</span><h2>Score : ' + score + ' / 1</h2><p>Le score a été transmis à la plateforme.</p><button onclick="score=0;intro()">Recommencer</button>';
    try { parent.postMessage({ source: 'itlab-ap', tp: tp, score: score, max: 1 }, '*'); } catch (e) {}
  }
  intro();
</script>
</body>
</html>
